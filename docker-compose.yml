services:
  mongodb:
    image: mongo:7
    container_name: proyecto_final_mongo
    restart: unless-stopped
    command: ["bash", "-c", "cp /etc/mongo-keyfile-source /tmp/mongo-keyfile && chmod 400 /tmp/mongo-keyfile && exec mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: proyecto_final
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' localhost:27017 | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mongo_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile-source:ro

  mongo-init-replica:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongodb:27017", "--quiet", "--username", "admin", "--password", "admin123", "--authenticationDatabase", "admin", "--eval"]
    command:
      - >-
        try { var cfg = rs.conf(); if (cfg.members[0].host !== "localhost:27017") { cfg.members[0].host = "localhost:27017"; rs.reconfig(cfg, { force: true }); } }
        catch (error) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); }

volumes:
  mongo_data:
